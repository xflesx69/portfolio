  }

  .outline {

  .char-wrapper {
    position: relative;
    display: inline-block;
    font-size: 2.4em;
    line-height: 1;
    .outline-layer {
      position: absolute;
      left: 0;
      top: 0;

      /* -webkit-text-stroke: 3.5px black; */

      z-index: 1;
      pointer-events: none;

      color: white;
      text-shadow: 2px 0 red, -2.5px 0 cyan;
      z-index: 2;
      pointer-events: none;
    }
  }
